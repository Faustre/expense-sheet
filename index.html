<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Sheet</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Expense Tracker</h1>

        <div class="wallet-balance">
            <span>Balance: </span>
            <span id="balance">0</span>

            <span>Income: </span>
            <span id="income">0</span>

            <span>Expense: </span>
            <span id="expense">0</span>
        </div>

        <div>
            <ul id="expense-list">
                <!-- Expense items will be added here -->
            </ul>
        </div>

        <div class="add-transaction">
            <button type="button" class="add-expense-btn" id="add-expense-btn" aria-label="Add transaction">
                <i class="fas fa-plus" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <dialog id="transaction-dialog" aria-labelledby="dialog-title">
        <form id="transaction-form">
            <div class="dialog-header">
                <h2 id="dialog-title">Add transaction</h2>
                <button type="button" class="close-dialog-btn" id="close-dialog-btn" aria-label="Close">&times;</button>
            </div>

            <fieldset class="transaction-types">
                <legend>Transaction type</legend>
                <label><input type="radio" name="transaction-type" value="income" checked> Income</label>
                <label><input type="radio" name="transaction-type" value="expense"> Expense</label>
            </fieldset>

            <label class="field-label" for="income-category">Income type</label>
            <select id="income-category" name="income-category">
                <option value="Salary">Salary</option>
                <option value="Freelance">Freelance</option>
                <option value="Investment">Investment</option>
                <option value="Gift">Gift</option>
                <option value="Other">Other</option>
            </select>

            <label class="field-label" for="expense-category" hidden>Expense type</label>
            <select id="expense-category" name="expense-category" hidden disabled>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Housing">Housing</option>
                <option value="Bills">Bills</option>
                <option value="Shopping">Shopping</option>
                <option value="Health">Health</option>
                <option value="Other">Other</option>
            </select>

            <label class="field-label" for="transaction-amount">Amount</label>
            <input id="transaction-amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required>

            <button type="submit" class="submit-transaction-btn">Add transaction</button>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>

</html>
